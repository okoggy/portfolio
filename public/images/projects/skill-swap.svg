<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-skill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="card-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.12)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.03)"/>
    </linearGradient>
    <linearGradient id="accent-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="16" fill="url(#bg-skill)"/>
  <path d="M0 0h800v450H0z" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Grid overlay -->
  <g opacity="0.15" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 8">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
  </g>

  <!-- Top App Header -->
  <rect x="40" y="30" width="720" height="44" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
  <circle cx="65" cy="52" r="6" fill="#ef4444"/>
  <circle cx="85" cy="52" r="6" fill="#f59e0b"/>
  <circle cx="105" cy="52" r="6" fill="#10b981"/>
  <text x="130" y="56" fill="#94a3b8" font-family="monospace" font-size="12" font-weight="600">SKILL-SWAP // Live Peer Exchange Room #04</text>
  
  <rect x="620" y="42" width="120" height="20" rx="10" fill="url(#accent-blue)"/>
  <text x="680" y="56" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">LIVE SWAP</text>

  <!-- Main Split Layout: Video Room 1 & Video Room 2 -->
  <rect x="40" y="94" width="350" height="240" rx="12" fill="url(#card-glass)" stroke="rgba(255,255,255,0.15)"/>
  <circle cx="215" cy="190" r="45" fill="#1e293b" stroke="#3b82f6" stroke-width="3"/>
  <path d="M215 170a18 18 0 100 36 18 18 0 000-36zM185 220c0-15 15-22 30-22s30 7 30 22" fill="none" stroke="#94a3b8" stroke-width="3"/>
  <rect x="56" y="110" width="110" height="24" rx="12" fill="rgba(16,185,129,0.2)" stroke="#10b981"/>
  <text x="111" y="126" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Host: Teaching TS</text>

  <rect x="410" y="94" width="350" height="240" rx="12" fill="url(#card-glass)" stroke="rgba(255,255,255,0.15)"/>
  <circle cx="585" cy="190" r="45" fill="#1e293b" stroke="#818cf8" stroke-width="3"/>
  <path d="M585 170a18 18 0 100 36 18 18 0 000-36zM555 220c0-15 15-22 30-22s30 7 30 22" fill="none" stroke="#94a3b8" stroke-width="3"/>
  <rect x="426" y="110" width="120" height="24" rx="12" fill="rgba(99,102,241,0.2)" stroke="#818cf8"/>
  <text x="486" y="126" fill="#a5b4fc" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Learner: UI Design</text>

  <!-- Control bar bottom -->
  <rect x="40" y="350" width="720" height="65" rx="12" fill="rgba(15,23,42,0.8)" stroke="rgba(255,255,255,0.1)"/>
  <text x="65" y="388" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">WebSockets Real-time Audio/Video Session</text>
  <text x="65" y="404" fill="#64748b" font-family="monospace" font-size="11">Guilds: Web Dev • DSA • UI Design • Peer Review</text>

  <rect x="580" y="365" width="80" height="34" rx="8" fill="#ef4444"/>
  <text x="620" y="386" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">End Room</text>
  <rect x="670" y="365" width="75" height="34" rx="8" fill="#334155"/>
  <text x="707" y="386" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Mute</text>
</svg>
