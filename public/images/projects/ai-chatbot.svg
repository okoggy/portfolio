<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-bot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="16" fill="url(#bg-bot)"/>
  <path d="M0 0h800v450H0z" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Top App Header -->
  <rect x="40" y="30" width="720" height="44" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
  <circle cx="65" cy="52" r="6" fill="#ef4444"/>
  <circle cx="85" cy="52" r="6" fill="#f59e0b"/>
  <circle cx="105" cy="52" r="6" fill="#10b981"/>
  <text x="130" y="56" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="600">SKILL LAB // AI Conversational Chatbot Assistant</text>

  <!-- Chat Frame -->
  <rect x="40" y="90" width="720" height="330" rx="12" fill="rgba(15,23,42,0.75)" stroke="rgba(255,255,255,0.15)"/>

  <!-- User Message Bubble -->
  <rect x="360" y="115" width="370" height="50" rx="16" fill="#0284c7"/>
  <text x="380" y="145" fill="#ffffff" font-family="sans-serif" font-size="13">Explain how binary search log(N) time complexity works.</text>

  <!-- Bot Message Bubble -->
  <rect x="70" y="185" width="500" height="150" rx="16" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)"/>
  <text x="95" y="215" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">AI Assistant Response:</text>
  <text x="95" y="240" fill="#94a3b8" font-family="sans-serif" font-size="12">Binary search eliminates half of the remaining search space with each iteration.</text>

  <rect x="95" y="255" width="450" height="60" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="110" y="278" fill="#38bdf8" font-family="monospace" font-size="11">while (low &lt;= high) {</text>
  <text x="110" y="298" fill="#38bdf8" font-family="monospace" font-size="11">  let mid = Math.floor((low + high) / 2); ... }</text>

  <!-- Input Field Bottom -->
  <rect x="60" y="355" width="600" height="42" rx="21" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
  <text x="85" y="380" fill="#64748b" font-family="sans-serif" font-size="12">Ask another prompt...</text>
  <rect x="670" y="355" width="70" height="42" rx="21" fill="#38bdf8"/>
  <text x="705" y="380" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Send</text>
</svg>
