<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-email" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="16" fill="url(#bg-email)"/>
  <path d="M0 0h800v450H0z" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Top App Header -->
  <rect x="40" y="30" width="720" height="44" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
  <circle cx="65" cy="52" r="6" fill="#ef4444"/>
  <circle cx="85" cy="52" r="6" fill="#f59e0b"/>
  <circle cx="105" cy="52" r="6" fill="#10b981"/>
  <text x="130" y="56" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="600">RESEARCH // Email Header Phishing Inspector</text>

  <!-- Left Header Raw Text -->
  <rect x="40" y="90" width="350" height="330" rx="12" fill="rgba(15,23,42,0.8)" stroke="rgba(255,255,255,0.12)"/>
  <text x="60" y="120" fill="#a1a1aa" font-family="monospace" font-size="11" font-weight="600">RAW EMAIL HEADERS</text>
  <rect x="60" y="135" width="310" height="265" rx="6" fill="#020617"/>
  <text x="75" y="160" fill="#38bdf8" font-family="monospace" font-size="10">Received: from mail-server.net</text>
  <text x="75" y="180" fill="#64748b" font-family="monospace" font-size="10">  by mx.google.com with ESMTPS</text>
  <text x="75" y="200" fill="#38bdf8" font-family="monospace" font-size="10">Authentication-Results:</text>
  <text x="75" y="220" fill="#34d399" font-family="monospace" font-size="10">  spf=pass (sender IP: 198.51.100.1)</text>
  <text x="75" y="240" fill="#34d399" font-family="monospace" font-size="10">  dkim=pass header.i=@domain.com</text>
  <text x="75" y="260" fill="#fbbf24" font-family="monospace" font-size="10">  dmarc=pass (p=QUARANTINE)</text>
  <text x="75" y="290" fill="#64748b" font-family="monospace" font-size="10">X-Originating-IP: [198.51.100.1]</text>

  <!-- Right Analysis Breakdown -->
  <rect x="410" y="90" width="350" height="330" rx="12" fill="rgba(15,23,42,0.8)" stroke="rgba(255,255,255,0.12)"/>
  <text x="430" y="120" fill="#a1a1aa" font-family="monospace" font-size="11" font-weight="600">PARSED THREAT ANALYSIS</text>

  <rect x="430" y="140" width="310" height="70" rx="10" fill="rgba(16,185,129,0.1)" stroke="#10b981"/>
  <text x="450" y="168" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="700">Phishing Indicator: LOW RISK</text>
  <text x="450" y="190" fill="#94a3b8" font-family="monospace" font-size="11">Confidence Score: 94.2% Legit</text>

  <rect x="430" y="225" width="310" height="80" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
  <text x="450" y="250" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">IP Geolocation Info</text>
  <text x="450" y="270" fill="#94a3b8" font-family="monospace" font-size="11">Country: United States (US)</text>
  <text x="450" y="288" fill="#94a3b8" font-family="monospace" font-size="11">ISP: Cloud Infrastructure</text>

  <rect x="430" y="320" width="310" height="80" rx="10" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
  <text x="450" y="345" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">Header Inspection Signals</text>
  <text x="450" y="365" fill="#34d399" font-family="monospace" font-size="10">✓ No domain spoofing detected</text>
  <text x="450" y="383" fill="#34d399" font-family="monospace" font-size="10">✓ Valid SPF and DKIM signatures</text>
</svg>
