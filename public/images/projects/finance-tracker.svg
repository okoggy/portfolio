<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-finance" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="chart-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.4)"/>
      <stop offset="100%" stop-color="rgba(16, 185, 129, 0.0)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="16" fill="url(#bg-finance)"/>
  <path d="M0 0h800v450H0z" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Top App Header -->
  <rect x="40" y="30" width="720" height="44" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
  <circle cx="65" cy="52" r="6" fill="#ef4444"/>
  <circle cx="85" cy="52" r="6" fill="#f59e0b"/>
  <circle cx="105" cy="52" r="6" fill="#10b981"/>
  <text x="130" y="56" fill="#a7f3d0" font-family="monospace" font-size="12" font-weight="600">FINANCE-TRACKER // Dashboard &amp; Analytics</text>

  <!-- Metric Card 1 -->
  <rect x="40" y="94" width="220" height="90" rx="12" fill="rgba(255,255,255,0.07)" stroke="rgba(16,185,129,0.3)"/>
  <text x="60" y="120" fill="#a7f3d0" font-family="sans-serif" font-size="11" font-weight="500">Total Net Balance</text>
  <text x="60" y="152" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="700">$12,450.80</text>
  <text x="60" y="172" fill="#34d399" font-family="monospace" font-size="10">+14.2% this month</text>

  <!-- Metric Card 2 -->
  <rect x="280" y="94" width="220" height="90" rx="12" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.1)"/>
  <text x="300" y="120" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="500">Monthly Expenses</text>
  <text x="300" y="152" fill="#f87171" font-family="sans-serif" font-size="24" font-weight="700">$2,180.40</text>
  <text x="300" y="172" fill="#fca5a5" font-family="monospace" font-size="10">8 transactions</text>

  <!-- Metric Card 3 -->
  <rect x="520" y="94" width="240" height="90" rx="12" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.1)"/>
  <text x="540" y="120" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="500">Savings Goal Progress</text>
  <text x="540" y="152" fill="#60a5fa" font-family="sans-serif" font-size="24" font-weight="700">82%</text>
  <rect x="540" y="162" width="180" height="8" rx="4" fill="rgba(255,255,255,0.1)"/>
  <rect x="540" y="162" width="148" height="8" rx="4" fill="#3b82f6"/>

  <!-- Main Area Chart Visualization -->
  <rect x="40" y="204" width="720" height="210" rx="12" fill="rgba(15,23,42,0.6)" stroke="rgba(255,255,255,0.1)"/>
  <path d="M60 380 Q 150 320, 240 340 T 420 270 T 600 290 T 720 240 L 720 390 L 60 390 Z" fill="url(#chart-glow)"/>
  <path d="M60 380 Q 150 320, 240 340 T 420 270 T 600 290 T 720 240" fill="none" stroke="#10b981" stroke-width="3"/>
  
  <circle cx="420" cy="270" r="6" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
  <rect x="380" y="230" width="80" height="26" rx="6" fill="#10b981"/>
  <text x="420" y="247" fill="#ffffff" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">+$3,400</text>

  <text x="60" y="230" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">Real-Time Income &amp; Expense Velocity Chart</text>
</svg>
