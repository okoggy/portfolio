<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-hms" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#31103f"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="16" fill="url(#bg-hms)"/>
  <path d="M0 0h800v450H0z" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Top App Header -->
  <rect x="40" y="30" width="720" height="44" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
  <circle cx="65" cy="52" r="6" fill="#ef4444"/>
  <circle cx="85" cy="52" r="6" fill="#f59e0b"/>
  <circle cx="105" cy="52" r="6" fill="#10b981"/>
  <text x="130" y="56" fill="#c084fc" font-family="monospace" font-size="12" font-weight="600">ACADEMIC // Hospital Management Portal</text>

  <!-- Left Sidebar Mock -->
  <rect x="40" y="90" width="180" height="330" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
  <rect x="56" y="110" width="148" height="32" rx="6" fill="#8b5cf6"/>
  <text x="76" y="131" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600">Dashboard</text>

  <rect x="56" y="152" width="148" height="32" rx="6" fill="transparent"/>
  <text x="76" y="173" fill="#94a3b8" font-family="sans-serif" font-size="12">Patient Records</text>

  <rect x="56" y="194" width="148" height="32" rx="6" fill="transparent"/>
  <text x="76" y="215" fill="#94a3b8" font-family="sans-serif" font-size="12">Doctor Roster</text>

  <rect x="56" y="236" width="148" height="32" rx="6" fill="transparent"/>
  <text x="76" y="257" fill="#94a3b8" font-family="sans-serif" font-size="12">Appointments</text>

  <!-- Main Content Table -->
  <rect x="240" y="90" width="520" height="330" rx="12" fill="rgba(15,23,42,0.7)" stroke="rgba(255,255,255,0.1)"/>
  <text x="265" y="125" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="600">Patient Appointments Queue</text>

  <!-- Table Headers -->
  <rect x="265" y="145" width="470" height="28" fill="rgba(255,255,255,0.05)"/>
  <text x="280" y="163" fill="#a78bfa" font-family="monospace" font-size="11">PATIENT ID</text>
  <text x="390" y="163" fill="#a78bfa" font-family="monospace" font-size="11">DOCTOR</text>
  <text x="520" y="163" fill="#a78bfa" font-family="monospace" font-size="11">DEPT</text>
  <text x="650" y="163" fill="#a78bfa" font-family="monospace" font-size="11">STATUS</text>

  <!-- Rows -->
  <g font-family="sans-serif" font-size="12" fill="#e2e8f0">
    <!-- Row 1 -->
    <text x="280" y="200" font-family="monospace" font-size="11">#PAT-8821</text>
    <text x="390" y="200">Dr. A. Sharma</text>
    <text x="520" y="200">Cardiology</text>
    <rect x="645" y="186" width="75" height="20" rx="10" fill="rgba(16,185,129,0.2)"/>
    <text x="682" y="200" fill="#34d399" font-family="monospace" font-size="10" text-anchor="middle">Checked In</text>

    <!-- Row 2 -->
    <text x="280" y="240" font-family="monospace" font-size="11">#PAT-8822</text>
    <text x="390" y="240">Dr. R. Verma</text>
    <text x="520" y="240">Neurology</text>
    <rect x="645" y="226" width="75" height="20" rx="10" fill="rgba(245,158,11,0.2)"/>
    <text x="682" y="240" fill="#fbbf24" font-family="monospace" font-size="10" text-anchor="middle">Scheduled</text>

    <!-- Row 3 -->
    <text x="280" y="280" font-family="monospace" font-size="11">#PAT-8823</text>
    <text x="390" y="280">Dr. S. Kulkarni</text>
    <text x="520" y="280">Orthopedics</text>
    <rect x="645" y="266" width="75" height="20" rx="10" fill="rgba(59,130,246,0.2)"/>
    <text x="682" y="280" fill="#60a5fa" font-family="monospace" font-size="10" text-anchor="middle">In Consult</text>
  </g>
</svg>
